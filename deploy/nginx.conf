# /etc/nginx/sites-available/listen.dayjoy.in
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/listen.dayjoy.in
#   sudo ln -s /etc/nginx/sites-available/listen.dayjoy.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d listen.dayjoy.in
#
# certbot rewrites the listen directives and adds the ssl_certificate lines.

# Modest protection for the console endpoints. Listeners are not rate limited -
# a whole training centre behind one NAT address is a normal, legitimate pattern.
limit_req_zone $binary_remote_addr zone=dayjoy_console:1m rate=10r/m;

upstream dayjoy_audio {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name listen.dayjoy.in;

    # certbot replaces this block after the certificate is issued.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name listen.dayjoy.in;

    # ssl_certificate / ssl_certificate_key are added by certbot.

    access_log /var/log/nginx/dayjoy-access.log;
    error_log  /var/log/nginx/dayjoy-error.log;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Text compresses; MP3 does not, and gzipping it only burns CPU.
    gzip on;
    gzip_types text/css application/javascript application/json text/html;
    gzip_min_length 512;

    # Audio must not sit in a proxy buffer waiting to be filled - that is
    # latency added for nothing, on top of a budget that has none to spare.
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- websockets ----
    # Without the Upgrade headers the live audio silently never connects: the
    # page loads, the language buttons work, and nothing ever plays.
    location /ws/ {
        proxy_pass http://dayjoy_audio;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A training runs far longer than nginx's 60-second default.
        proxy_read_timeout  7200s;
        proxy_send_timeout  7200s;
    }

    # ---- recorded audio ----
    # Byte-range requests are what let someone scrub through an hour-long
    # recording instead of waiting for the whole file.
    location /api/recordings/ {
        proxy_pass http://dayjoy_audio;
        proxy_set_header Range      $http_range;
        proxy_set_header If-Range   $http_if_range;
        proxy_force_ranges on;
    }

    # ---- consoles ----
    # These are protected by keys in the app. Uncomment the allow/deny lines to
    # additionally pin them to the office network.
    location ~ ^/(trainer|admin)$ {
        limit_req zone=dayjoy_console burst=20 nodelay;
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass http://dayjoy_audio;
    }

    location / {
        proxy_pass http://dayjoy_audio;
    }
}
